[project]
name = "android-mcp-beta"
version = "0.1.0"
description = "Clean-room reimplementation of the Android-MCP server for Android device automation."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Jeomon George", email = "jeogeoalukka@gmail.com" }
]
keywords = ["android", "mcp", "ai", "mobile", "ai agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

# Dependencies are added as each subsystem lands, not up front.
dependencies = [
    "click>=8.2.1",
    "fastmcp>=4.1.3",
    "pillow>=11.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[project.scripts]
android-mcp-beta = "android_mcp.__main__:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
    "unit: unit tests, no device needed",
    "live: drives a real device or emulator; skipped unless ANDROID_MCP_LIVE=1",
]
